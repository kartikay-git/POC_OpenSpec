[project]
name = "openspec-langchain-poc"
version = "0.1.0"
description = "A local, inspectable OpenSpec + LangChain coding-agent experiment"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "langchain>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

